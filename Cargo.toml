[workspace]
members = [".", "migration"]

[package]
name = "act_web_server"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

[features]
default = []
ui-leptos = ["dep:leptos"]
ui-dioxus = ["dep:dioxus", "dep:dioxus-ssr"]

[dependencies]
act-api-server = { git = "https://github.com/anticaptrad/act-api-server.rs", rev = "f22ed47258c07556ab5bd1375efa3bc8ad56df29", package = "act_api_server" }
async-nats = "0.50"
async-trait = "0.1"
tokio = { version = "1.37.0", features = ["full"] }
axum = "0.7.5"
maud = { version = "0.26.0", features = ["axum"] }
leptos = { version = "0.8.10", default-features = false, features = ["ssr"], optional = true }
dioxus = { version = "0.7.3", default-features = false, features = ["minimal"], optional = true }
dioxus-ssr = { version = "0.7.3", optional = true }
serde = { version = "1.0.197", features = ["derive"] }
serde_json = "1.0.115"
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.18", features = ["env-filter"] }
tracing-opentelemetry = "0.28.0"
opentelemetry = "0.27.0"
opentelemetry_sdk = { version = "0.27.1", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.27.0", features = ["grpc-tonic", "trace"] }
futures = "0.3"
next-loggers = { git = "https://github.com/ores-otel/ores.otel.log", rev = "ca176fb6768a9750d262a536952268625ffd3a8a", package = "oresoftware-next-loggers" }
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls", "stream"] }
rustls = "0.23"
sea-orm = { version = "1.1.20", default-features = false, features = ["runtime-tokio-rustls", "sqlx-postgres", "macros"] }
shared-auth-client = { git = "https://github.com/shared-auth/shared-auth-clients", rev = "cc57a85b276bee81ad94decc87df2f48d49cab9f", package = "shared-auth-client" }
tokio-rustls = "0.26"
tokio-util = { version = "0.7", features = ["codec"] }
anyhow = "1.0"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[profile.release]
strip = true
lto = "thin"
