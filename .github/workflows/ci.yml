name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
          show-progress: false

      - name: Install stable Rust with required components
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      - name: Install pinned Zed CLI
        run: cargo install --git https://github.com/zed-pkg/zed-cli --rev 822bbdef7ebb9218a83ad7d3b3dca78ade1add79 --locked zed-cli

      - name: Materialize browser worker package
        run: zed install --allow-build --install-mode copy

      - name: Verify ores-sw payload
        run: |
          test -f .vendor/.zed/oresoftware/ores-sw/dist/service-worker.js
          test -f .vendor/.zed/oresoftware/ores-sw/rust/axum08.rs

      - name: Format
        run: cargo fmt --all -- --check

      - name: Test workspace
        run: cargo test --workspace --all-targets --locked

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Release build
        run: cargo build --workspace --release --locked
