[package]
name = "migration"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "migration"
path = "src/lib.rs"

[[bin]]
name = "migration"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.37.0", features = ["macros", "rt-multi-thread"] }
async-trait = "0.1"

[dependencies.sea-orm-migration]
version = "1.0"
features = ["runtime-tokio-rustls", "sqlx-postgres"]
